name: ci

on:
  push:
    branches: [master, main]
  pull_request:

# The token this workflow is handed is the token anything it runs could use.
# Nothing here writes: it clones, installs its tools and runs the suite. Saying
# so explicitly is what stops a step added later — or a dependency of one — from
# inheriting write access to this repository by default.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # PINNED TO A COMMIT, NOT A TAG. A tag is a pointer its owner can move, so
      # `@v5` means "whatever actions/checkout is on the day CI runs" — code
      # nobody reviewed, executing with this workflow's token. The trailing
      # comment names the release that SHA was, so an upgrade stays a legible
      # one-line change rather than an opaque one.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # The suite runs against a sandbox HOME with a stubbed hyprctl, so it
      # needs no compositor. glslangValidator and qmllint are used when they
      # are present and skipped loudly when they are not; jq and python3 are
      # the only hard requirements.
      - name: deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends jq glslang-tools shellcheck

      - name: run the tests
        run: ./test/run

      # The watch lifts the geometry's jq program out and does `cap` and
      # `emit_block` itself, so the two must bake the same block.
      - name: the fast snapshot matches the geometry
        run: ./test/probe-snapshot-parity

      # A tile resize posts no Hyprland event, so the watch polls the rects, and
      # a fatal watch must not exit 0. The probe drives the real watcher over
      # fake sockets that stay silent.
      - name: a silent resize moves the tube, and a dead watch says so
        run: ./test/probe-silent-resize

      # Prove the suite can FAIL. A green suite is only evidence if a known
      # break turns it red: test/run once passed with a shader constant renamed.
      - name: prove the tests catch a shader mutation
        run: |
          cp crt/crt-glass.frag /tmp/crt-glass.orig
          sed -i 's/^const float TUBE_K1 /const float TUBE_KX /' crt/crt-glass.frag
          if ./test/run >/dev/null 2>&1; then
            echo "SENTINEL FAILED: the suite passed with TUBE_K1 renamed to TUBE_KX" >&2
            cp /tmp/crt-glass.orig crt/crt-glass.frag
            exit 1
          fi
          cp /tmp/crt-glass.orig crt/crt-glass.frag
          echo "sentinel ok: a renamed shader constant turns the suite red"

      # And it must go red with the poll switched off, or it proves nothing.
      - name: prove the resize probe catches a dead poll
        run: |
          d="$(mktemp -d)"
          cp crt/tubes-geometry crt/crt-glass.frag "$d/"
          sed 's/^    RECT_POLL = 0\.10$/    RECT_POLL = 3600/' crt/crt >"$d/crt"
          chmod +x "$d/crt"
          grep -q '^    RECT_POLL = 3600$' "$d/crt" || { echo "mutation did not apply" >&2; exit 1; }
          if ./test/probe-silent-resize "$d/crt" >/dev/null 2>&1; then
            echo "SENTINEL FAILED: the probe passed with the rect poll disabled" >&2
            exit 1
          fi
          echo "sentinel ok: a disabled rect poll turns the probe red"

      # Same for the native pass, which CI cannot run: a broken owner must go red.
      - name: prove the tests catch a broken native owner
        run: |
          cp crt/crt /tmp/crt.orig
          sed -i 's/^        return bool(sig) and native_flag().*/        return False/' crt/crt
          cmp -s crt/crt /tmp/crt.orig && { echo "mutation did not apply" >&2; exit 1; }
          if ./test/run >/dev/null 2>&1; then
            echo "SENTINEL FAILED: the suite passed with native_active always false" >&2
            cp /tmp/crt.orig crt/crt
            exit 1
          fi
          cp /tmp/crt.orig crt/crt
          echo "sentinel ok: a broken native owner turns the suite red"

      # bin/sync-tubes-geometry is Python, not shell, and shellcheck refuses
      # it outright (SC1071) rather than skipping it.
      - name: shellcheck the scripts
        run: shellcheck -S warning bin/shoot test/run native/sandbox native/build native/rig/up native/rig/scene native/rig/matrix
